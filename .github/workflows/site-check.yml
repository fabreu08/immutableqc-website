name: site-check

# Every action is pinned to a full commit SHA; the version is in the comment beside it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-check:
    name: Build check (asserts, lints, output up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Rebuild in memory and compare with the committed output
        run: node site/build.mjs --check

  browser-check:
    name: Browser checks (links, overflow, taps, axe, frames at rest, no-JS text, budgets)
    runs-on: ubuntu-latest
    needs: build-check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the check tools (dev dependencies only)
        working-directory: site
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run the browser checks over every page and dashboard/, served as the Pages workflow publishes them
        run: node site/tools/check.mjs --json=site-check-results.json
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-check-results
          path: site-check-results.json
          if-no-files-found: ignore
