name: site-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-check:
    name: Build check (asserts, lints, output up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild in memory and compare with the committed output
        run: node site/build.mjs --check

  browser-check:
    name: Browser checks (links, overflow, taps, axe, frames at rest, no-JS text, budgets)
    runs-on: ubuntu-latest
    needs: build-check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the check tools (dev dependencies only)
        working-directory: site
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run the browser checks over every page and dashboard/
        run: node site/tools/check.mjs --json=site-check-results.json
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-check-results
          path: site-check-results.json
          if-no-files-found: ignore
