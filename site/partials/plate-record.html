<figure class="fig" aria-labelledby="p-t">
<div class="plate" data-plate data-n="{{sn}}" data-sig="{{ssig}}" data-pub="{{pub}}">
<div class="plate-h"><p class="fig-no">Fig. 1</p><p class="plate-t" id="p-t">One sealed record</p><p class="sim">Simulated · demo data</p></div>
<p class="p-sub">Record {{sn}} of {{N}} · sequence {{seq}} · {{assay}}</p>
<div class="p-grid">
<div>
<h3 class="lab">Sealed fields</h3>
<dl class="kv">
<dt>Instrument</dt><dd data-f="instrumentId">{{f_instrumentId}}</dd>
<dt>Measurement</dt><dd data-f="sensorType">{{f_sensorType}}</dd>
<dt>Peak area</dt><dd data-f="value">{{f_value}}</dd>
<dt>Unit</dt><dd data-f="unit">{{f_unit}}</dd>
<dt>Captured (UTC)</dt><dd data-f="capturedAt">{{f_capturedAtHTML}}</dd>
</dl>
</div>
<div>
<h3 class="lab">Context <span class="sub">· not sealed in the alpha</span></h3>
<dl class="kv kv--ctx">
<dt>Injection</dt><dd>{{c_inj}}</dd>
<dt>Sample</dt><dd>{{c_sample}}, {{c_prep}}</dd>
<dt>Retention time</dt><dd>{{c_rt}} min</dd>
</dl>
</div>
</div>
<ol class="coa" aria-label="Verification of record {{sn}}">
<li class="coa-h" aria-hidden="true"><span>Check</span><span>Basis</span><span>Result</span></li>
<li data-check="fp" data-s="build"><span class="c-n">Fingerprint recomputed</span><span class="c-b">SHA-256 of the five fields vs r<sub>{{sn}}</sub></span><span class="res"><svg class="i" aria-hidden="true"><use href="#i-ok"/></svg><span class="w">Match</span></span></li>
<li data-check="sig" data-s="build"><span class="c-n">Signature checked</span><span class="c-b">ECDSA P-256, demo public key</span><span class="res"><svg class="i" aria-hidden="true"><use href="#i-ok"/></svg><span class="w">Valid</span></span></li>
<li data-check="link" data-s="build"><span class="c-n">Link recomputed</span><span class="c-b">SHA-256 of h<sub>{{sp}}</sub> + r<sub>{{sn}}</sub> + “{{sn}}” vs h<sub>{{sn}}</sub></span><span class="res"><svg class="i" aria-hidden="true"><use href="#i-ok"/></svg><span class="w">Intact</span></span></li>
</ol>
<div class="plate-f">
<p class="pst" role="status" data-pst>Checked at build.<span class="nojs"> Live checking in your browser needs JavaScript.</span></p>
<a class="go" href="check.html#verifier"><span>Check any record yourself</span><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg></a>
</div>
<div class="p-raw">
<h3 class="lab p-raw-h">Raw data <span class="sub">· the values the checks above recompute</span></h3>
<div class="p-blk">
<p class="lab">Payload <span class="sub">· instrumentId|<wbr>sensorType|<wbr>value|<wbr>unit|<wbr>capturedAt</span></p>
<p class="hx hx-s p-pl">{{payloadW}}</p>
</div>
<div class="p-blk">
<p class="lab">Fingerprint <var>r</var><sub>{{sn}}</sub></p>
<p class="hx hx-l" data-h="r">{{rG}}</p>
<p class="say">SHA-256 of the {{pbytes}}-byte payload. One changed character gives a completely different fingerprint.</p>
</div>
<div class="p-blk">
<dl class="p-links">
<div><dt class="lab">Previous <var>h</var><sub>{{sp}}</sub> <span class="sub">· link of record {{sp}}</span></dt><dd class="hx hx-s" data-h="prev">{{prevG}}</dd></div>
<div><dt class="lab">Link <var>h</var><sub>{{sn}}</sub> <span class="sub">· carried by record {{snext}} as its previous link</span></dt><dd class="hx hx-s" data-h="h">{{hG}}</dd></div>
</dl>
</div>
<div class="p-blk">
<p class="lab">Signature <span class="sub">· ECDSA P-256 over r<sub>{{sn}}</sub> · demo key {{keyIdShort}}… · <a class="kid" href="check.html#method">public key in Method</a></span></p>
<p class="hx hx-s hx-sig">{{sigHead}} … {{sigTail}}</p>
</div>
</div>
<template id="iqc-plate-words"><i data-k="fp.ok">Match</i><i data-k="fp.bad">No match</i><i data-k="sig.ok">Valid</i><i data-k="sig.bad">Fails</i><i data-k="sig.na">Not checked</i><i data-k="link.ok">Intact</i><i data-k="link.bad">Broken</i><i data-k="st">Checked in your browser: {pass} of {n} pass · {ms} ms</i><i data-k="st.nosig">Checked in your browser: {pass} of 2 pass. The signature could not be checked here (it needs an https:// page).</i></template>
</div>
<figcaption class="figcap"><b>Fig. 1</b> · Record {{sn}} of the synthetic HPLC sequence {{seq}}, as an auditor or an AI agent would read it. <span class="k">Basis</span> Same five fields, order and link rule as the alpha app’s HPLC import, where the instrument field is the app’s internal instrument number; SHA-256 is FIPS 180-4. {{demoSig}}</figcaption>
</figure>
